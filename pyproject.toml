[project]
name = "pytest-playwright-mt"
version = "0.1.0"
description = "Playwright integration into pytest, for multi-threaded environments"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    { name = "Schaap", email = "cybermonktitan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.64.0",
    "pytest>=9.1.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[project.entry-points.pytest11]
pytest_playwright_mt = "pytest_playwright_mt.playwright_mt_fixture"
